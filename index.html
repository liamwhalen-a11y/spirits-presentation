<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#171615">
<title>Private presentation</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171615;color:#f2eee7;font-family:Arial,Helvetica,sans-serif;min-height:100svh;display:grid;place-items:center;padding:32px}main{width:min(100%,440px)}.mark{font-size:12px;letter-spacing:.16em;margin:0 0 72px;color:#b7b0a7}h1{font-size:clamp(48px,9vw,74px);font-weight:400;letter-spacing:-.055em;line-height:.96;margin:0 0 38px}label{display:block;font-size:12px;margin-bottom:12px}input{width:100%;background:transparent;border:0;border-bottom:1px solid #776f65;color:#fff;border-radius:0;padding:16px 0;font-size:20px;outline-offset:6px}input:focus{outline:1px solid #c5b5a0}button{width:100%;border:0;background:#f2eee7;color:#171615;font:inherit;font-size:14px;padding:19px 24px;margin-top:26px;display:flex;justify-content:space-between;cursor:pointer}button:hover{background:#fff}button:disabled{opacity:.6;cursor:wait}#status{font-size:13px;line-height:1.5;min-height:42px;color:#d8bca8;margin-top:18px}.note{color:#8e8780;font-size:11px;line-height:1.6;margin-top:42px}a{color:inherit} @media(prefers-reduced-motion:no-preference){main{animation:appear .6s ease both}@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}}
</style>
</head>
<body><main><p class="mark">PRIVATE PRESENTATION</p><h1>Access<br>the proposal.</h1><form id="unlock"><label for="password">Enter password</label><input type="password" id="password" name="password" autocomplete="current-password" required autofocus><button type="submit"><span>Open presentation</span><span aria-hidden="true">↗</span></button><p id="status" role="status" aria-live="polite"></p></form><p class="note">Password required. No account needed.</p></main>
<script>
const form=document.querySelector('#unlock'),status=document.querySelector('#status'),button=form.querySelector('button');
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
form.addEventListener('submit',async event=>{
 event.preventDefault();button.disabled=true;status.textContent='Opening presentation…';
 const password=document.querySelector('#password').value;
 let bundle;
 try {
  if(!crypto.subtle||!globalThis.DecompressionStream)throw new Error('browser');
  const manifestResponse=await fetch('./payload.json',{cache:'no-store'});
  if(!manifestResponse.ok)throw new Error('network');
  const manifest=await manifestResponse.json();
  const encryptedResponse=await fetch('./'+manifest.file,{cache:'no-store'});
  if(!encryptedResponse.ok)throw new Error('network');
  const encrypted=await encryptedResponse.arrayBuffer();
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(manifest.salt),iterations:manifest.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
  let plain;
  try{plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(manifest.iv)},key,encrypted);}catch{throw new Error('password');}
  const stream=new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
  bundle=JSON.parse(await new Response(stream).text());
 }catch(error){status.textContent=error.message==='password'?'That password didn’t match. Please try again.':error.message==='browser'?'Please open this link in a current version of Chrome, Safari, Firefox or Edge.':'Couldn’t load the presentation. Check your connection and try again.';button.disabled=false;document.querySelector('#password').focus();return;}
 const urls={};
 for(const [name,file] of Object.entries(bundle.files))urls[name]=URL.createObjectURL(new Blob([bytes(file.data)],{type:file.mime}))+'#'+name;
 const pattern=new RegExp(Object.keys(urls).sort((a,b)=>b.length-a.length).map(s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
 const rewrite=text=>text.replace(pattern,name=>urls[name]);
 const script=text=>'<script>'+rewrite(text).replace(/<\/script/gi,'<\\/script')+'<\/script>';
 let html=rewrite(bundle['index.html']);
 html=html.replace('<link rel="stylesheet" href="style.css">',()=>'<style>'+rewrite(bundle['style.css'])+'</style>');
 html=html.replace('<script src="data.js"><\/script>',()=>script(bundle['data.js']));
 html=html.replace('<script src="app.js"><\/script>',()=>script(bundle['app.js']));
 html=html.replace('</body>','<button id="lock-presentation" style="position:fixed;right:18px;bottom:18px;z-index:50;padding:10px 15px;border:1px solid #797169;border-radius:24px;background:#171615;color:#f2eee7;font:12px Arial;cursor:pointer" onclick="location.reload()">Lock ↗</button></body>');
 document.querySelector('#password').value='';
 document.open();document.write(html);document.close();
});
</script></body></html>
